<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CultiVoice</title>
<style>
  :root{--bg:#F5F8F4;--card:#fff;--ink:#17261D;--muted:#5E6F63;--line:#DCE5DD;--g:#2E7D4F;--gd:#1F3D2B;--gl:#E4F1E8;--amber:#C77F00;--amberl:#FFF3DB;--red:#B3261E}
  @media (prefers-color-scheme:dark){:root{--bg:#101712;--card:#18221B;--ink:#E7EFE9;--muted:#9DB0A2;--line:#2A3A2F;--g:#5BBE82;--gd:#CFE9D8;--gl:#1F3326;--amber:#E5A93A;--amberl:#33290F;--red:#F2B8B5}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI","Nirmala UI","Noto Sans Tamil","Noto Sans Devanagari",sans-serif}
  header{background:var(--gd);color:#fff;padding:14px 16px}
  @media (prefers-color-scheme:dark){header{background:#1F3326;color:#E7EFE9}}
  .wrap{max-width:1080px;margin:0 auto;padding:0 16px}
  .hrow{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .brand{font-size:22px;font-weight:700;letter-spacing:.2px}.brand small{display:block;font-size:12.5px;font-weight:400;opacity:.8}
  .lang button{background:transparent;border:1px solid rgba(255,255,255,.45);color:inherit;padding:5px 12px;border-radius:999px;cursor:pointer;font:inherit;margin-left:4px}
  .lang button.on{background:#fff;color:#1F3D2B;font-weight:600}
  nav{display:flex;gap:4px;overflow-x:auto;padding:12px 0 0;border-bottom:1px solid var(--line);margin-bottom:16px}
  nav button{background:none;border:0;padding:9px 14px;font:inherit;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
  nav button.on{color:var(--g);border-bottom-color:var(--g);font-weight:600}
  .grid{display:grid;grid-template-columns:340px 1fr;gap:16px}
  @media (max-width:820px){.grid{grid-template-columns:1fr}}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
  h2{font-size:16px;margin:0 0 10px}h3{font-size:14px;margin:14px 0 6px;color:var(--muted);font-weight:600}
  label{display:block;font-size:13px;color:var(--muted);margin-top:10px}
  .sl{display:flex;align-items:center;gap:8px}.sl input[type=range]{flex:1;accent-color:var(--g)}
  input[type=number],select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit}
  .sl input[type=number]{width:76px}
  button.primary{width:100%;margin-top:14px;padding:11px;border:0;border-radius:10px;background:var(--g);color:#fff;font:inherit;font-weight:600;cursor:pointer}
  button.ghost{background:var(--gl);color:var(--g);border:0;border-radius:8px;padding:7px 12px;cursor:pointer;font:inherit;font-size:13px}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .crop{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}.crop:first-of-type{border-top:0}
  .crop .nm{width:120px;font-weight:600}.crop .nm small{display:block;font-weight:400;color:var(--muted);font-size:12px}
  .bar{flex:1;height:10px;background:var(--gl);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--g)}
  .crop.first .bar i{background:var(--g)}.crop:not(.first) .bar i{background:#8FB79C}
  .pct{width:48px;text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
  .chip{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600}
  .typical{background:var(--gl);color:var(--g)}.edge{background:var(--amberl);color:var(--amber)}.unusual{background:#FBE3E1;color:var(--red)}
  @media (prefers-color-scheme:dark){.unusual{background:#3A1D1B}}
  .why li{margin:6px 0}.why{padding-left:18px;margin:0}
  .note{font-size:12.5px;color:var(--muted);background:var(--amberl);border-radius:8px;padding:8px 10px;margin-top:10px}
  .big{font-size:34px;font-weight:700;color:var(--g);line-height:1.1}.muted{color:var(--muted)}
  table{width:100%;border-collapse:collapse;font-size:13.5px}th,td{padding:6px 8px;text-align:right;border-bottom:1px solid var(--line)}th:first-child,td:first-child{text-align:left}th{color:var(--muted);font-weight:600}
  .hb{display:flex;align-items:center;gap:8px;margin:4px 0;font-size:13px}.hb span:first-child{width:110px}.hb .bar{height:12px}
  .scen{display:flex;gap:6px;flex-wrap:wrap}.scen div{flex:1;min-width:88px;text-align:center;background:var(--gl);border-radius:8px;padding:8px 4px;font-size:13px}.scen b{display:block}
  svg text{fill:var(--muted);font-size:11px}
  .hidden{display:none}
  footer{color:var(--muted);font-size:12.5px;padding:8px 0 28px}
  #toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--gd);color:#fff;padding:9px 16px;border-radius:999px;font-size:13px;opacity:0;transition:.25s;pointer-events:none}#toast.on{opacity:1}
  .bub{max-width:92%;padding:10px 12px;border-radius:12px;margin:8px 0;line-height:1.45;font-size:14.5px}.bub.me{background:var(--gl);margin-left:auto;color:var(--ink)}
  .bub.bot{background:var(--card);border:1px solid var(--line)}.bub.warn{background:var(--amberl);border-color:transparent;font-size:13px}
  #chatLog{max-height:520px;min-height:180px;overflow-y:auto;padding:4px 2px}
  .chatrow{display:flex;gap:8px;margin-top:10px}.chatrow input[type=text]{flex:1;min-width:0;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit}
  .chatrow button.primary{width:auto;margin:0;padding:10px 14px;flex-shrink:0}.chatrow .ghost{flex-shrink:0}
  .kn{display:inline-block;margin:2px 3px 2px 0;padding:2px 9px;border-radius:999px;font-size:12px;background:var(--line);color:var(--muted)}.kn.has{background:var(--gl);color:var(--g);font-weight:600}
</style>
</head>
<body>
<header><div class="wrap hrow">
  <div class="brand">CultiVoice<small data-i="tagline"></small></div>
  <div class="lang" id="lang"><button data-l="en" class="on">English</button><button data-l="ta">தமிழ்</button><button data-l="hi">हिन्दी</button></div>
</div></header>
<main class="wrap">
<nav id="tabs"><button data-t="crop" class="on" data-i="tabCrop"></button><button data-t="yield" data-i="tabYield"></button><button data-t="fert" data-i="tabFert"></button><button data-t="info" data-i="tabInfo"></button><button data-t="chat" id="tabChatBtn"></button></nav>

<section id="crop"><div class="grid">
  <div class="card"><h2 data-i="yourField"></h2>
    <label data-i="preset"></label><select id="preset"></select>
    <div id="sliders"></div>
    <button class="primary" id="go" data-i="getAdvice"></button>
    <div class="row" style="margin-top:10px"><button class="ghost" id="mic" data-i="speak"></button><span class="muted" id="micMsg" style="font-size:12.5px"></span></div>
  </div>
  <div id="cropOut"><div class="card"><h2 data-i="recommend"></h2><div id="top"></div>
      <div class="row" style="margin-top:8px"><button class="ghost" id="say" data-i="readAloud"></button></div></div>
    <div class="card"><h2 data-i="whyTitle"></h2><ul class="why" id="why"></ul>
      <h3 data-i="radarTitle"></h3><div id="radar"></div></div>
    <div class="card"><h2 data-i="whatIfRain"></h2><div class="scen" id="scen"></div><div class="note" data-i="whatIfNote"></div></div>
    <div class="card" id="priceCard"><h2 data-i="price"></h2><div id="priceBox"></div></div>
  </div></div></section>

<section id="yield" class="hidden"><div class="grid">
  <div class="card"><h2 data-i="yieldIn"></h2>
    <label data-i="state"></label><select id="ystate"></select>
    <label data-i="crop"></label><select id="ycrop"></select>
    <label data-i="season"></label><select id="yseason"></select>
    <label data-i="area"></label><input type="number" id="yarea" min="1" step="100">
    <details style="margin-top:10px"><summary class="muted" data-i="advanced"></summary>
      <label data-i="rainAnnual"></label><input type="number" id="yrain" step="10">
      <label data-i="fertHa"></label><input type="number" id="yfert" step="1">
      <label data-i="pestHa"></label><input type="number" id="ypest" step="0.01"></details>
    <button class="primary" id="ygo" data-i="predictYield"></button></div>
  <div><div class="card"><h2 data-i="yieldOut"></h2><div id="yout"></div></div>
    <div class="card"><h2 data-i="compare"></h2><div id="ycmp"></div><div class="note" data-i="compareNote"></div></div></div>
</div></section>

<section id="fert" class="hidden"><div class="grid">
  <div class="card"><h2 data-i="fertIn"></h2>
    <label>N</label><input type="number" id="fN" value="37" min="0" max="45">
    <label>P</label><input type="number" id="fP" value="0" min="0" max="45">
    <label>K</label><input type="number" id="fK" value="0" min="0" max="45">
    <button class="primary" id="fgo" data-i="suggestFert"></button>
    <div class="note" data-i="fertNote"></div></div>
  <div class="card"><h2 data-i="fertOut"></h2><div id="fout"></div></div>
</div></section>

<section id="info" class="hidden"><div id="infoBody"></div></section>
<section id="chat" class="hidden"><div class="card">
  <h2 id="chatTitle"></h2><p class="muted" id="chatHint" style="margin:0 0 8px"></p>
  <div id="chatKnown" style="margin-bottom:6px"></div>
  <div class="row" style="margin-bottom:6px"><span class="muted" id="chatTry" style="font-size:13px"></span><span id="chatEx" class="row"></span></div>
  <div id="chatLog" aria-live="polite"></div>
  <form class="chatrow" id="chatForm" autocomplete="off"><input type="text" id="chatIn" aria-label="message"><button type="button" class="ghost" id="chatMic">🎤</button><button class="primary" id="chatSend" type="submit"></button></form>
  <div class="row" style="margin-top:8px"><button class="ghost" id="chatReset" type="button"></button></div>
</div></section>
<footer data-i="disclaimer"></footer>
</main>
<div id="toast"></div>

/* ---------- crop advisor ---------- */
const F = meta.crop_features, FS = meta.feature_stats;
const STEP = { N: 1, P: 1, K: 1, temperature: 0.1, humidity: 0.1, ph: 0.1, rainfall: 1 };
const PRESETS = ["rice", "maize", "chickpea", "mango", "coffee", "apple", "cotton"];
const state = Object.fromEntries(F.map((f) => [f, Math.round(meta.profiles.rice[f].mean / STEP[f]) * STEP[f]]));
function buildSliders() {
  $("sliders").innerHTML = F.map((f) => `<label>${fn(f)}</label><div class="sl"><input type="range" id="r_${f}" min="${FS[f].min}" max="${FS[f].max}" step="${STEP[f]}" value="${state[f]}"><input type="number" id="n_${f}" min="${FS[f].min}" max="${FS[f].max}" step="${STEP[f]}" value="${state[f]}"></div>`).join("");
  F.forEach((f) => {
    const r = $("r_" + f), n = $("n_" + f);
    r.oninput = () => { state[f] = +r.value; n.value = r.value; };
    n.oninput = () => { state[f] = +n.value; r.value = n.value; };
    r.onchange = n.onchange = run;
  });
}
function buildPresets() {
  $("preset").innerHTML = PRESETS.map((c) => `<option value="${c}">${cn(c)}</option>`).join("");
  $("preset").onchange = () => { F.forEach((f) => { state[f] = Math.round(meta.profiles[$("preset").value][f].mean / STEP[f]) * STEP[f]; $("r_" + f).value = $("n_" + f).value = state[f]; }); run(); };
}
function radarSVG(cropName) {
  const S = 300, c = S / 2, R = 105, n = F.length, ang = (i) => -Math.PI / 2 + (i * 2 * Math.PI) / n;
  const norm = (f, v) => Math.min(1, Math.max(0, (v - FS[f].min) / (FS[f].max - FS[f].min)));
  const pt = (i, v) => [c + Math.cos(ang(i)) * R * v, c + Math.sin(ang(i)) * R * v];
  const poly = (vals) => vals.map((v, i) => pt(i, v).join(",")).join(" ");
  const p10 = F.map((f) => norm(f, meta.profiles[cropName][f].p10)), p90 = F.map((f) => norm(f, meta.profiles[cropName][f].p90)), me = F.map((f) => norm(f, state[f]));
  const grid = [0.25, 0.5, 0.75, 1].map((k) => `<polygon points="${poly(F.map(() => k))}" fill="none" stroke="var(--line)"/>`).join("");
  const axes = F.map((f, i) => { const [x, y] = pt(i, 1.2); return `<line x1="${c}" y1="${c}" x2="${pt(i, 1)[0]}" y2="${pt(i, 1)[1]}" stroke="var(--line)"/><text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="middle">${fn(f).split(" (")[0]}</text>`; }).join("");
  return `<svg viewBox="0 0 ${S} ${S}" width="100%" style="max-width:340px" role="img" aria-label="radar">${grid}${axes}
    <polygon points="${poly(p90)}" fill="var(--g)" fill-opacity=".18" stroke="var(--g)" stroke-dasharray="4 3"/><polygon points="${poly(p10)}" fill="var(--card)" stroke="var(--g)" stroke-dasharray="4 3"/>
    <polygon points="${poly(me)}" fill="var(--amber)" fill-opacity=".25" stroke="var(--amber)" stroke-width="2"/></svg>
    <div class="muted" style="font-size:12.5px"><span style="color:var(--amber)">■</span> ${t("yourVal")} &nbsp; <span style="color:var(--g)">■</span> ${t("usual")} (10–90%)</div>`;
}
let lastTop, lastWhy;
function run() {
  const top = E.topCrops(crop, state, 3); lastTop = top;
  $("top").innerHTML = top.map((o, i) => `<div class="crop ${i ? "" : "first"}"><div class="nm">${cn(o.crop)}${L !== "en" ? `<small>${o.crop}</small>` : ""}</div><div class="bar"><i style="width:${(o.prob * 100).toFixed(1)}%"></i></div><div class="pct">${(o.prob * 100).toFixed(0)}%</div></div>`).join("");
  const best = top[0].crop, why = E.explainCrop(crop, meta, state, best); lastWhy = why;
  $("why").innerHTML = why.slice(0, 4).map((w) => `<li><b>${fn(w.feature)}</b> ${+(+w.value).toFixed(1)} <span class="chip ${w.status}">${t(w.status)}</span> <span class="muted">(${w.typical.map((x) => +x.toFixed(1)).join("–")}) · ${t("conf")} ${w.influence >= 0 ? "+" : ""}${(w.influence * 100).toFixed(0)} pts</span></li>`).join("");
  $("radar").innerHTML = radarSVG(best);
  $("scen").innerHTML = E.rainfallWhatIf(crop, state).map((s) => `<div><span class="muted">${s.pct > 0 ? "+" : ""}${s.pct}%</span><b>${cn(s.top[0].crop)}</b>${(s.top[0].prob * 100).toFixed(0)}%</div>`).join("");
  const ph = E.priceHint(meta, best);

}

$("mic").onclick = () => {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition; if (!SR) return toast(t("unsupported"));
  const rec = new SR(); rec.lang = SPEECH[L]; rec.onresult = (e) => {
    const s = e.results[0][0].transcript.toLowerCase(); let hit = 0;
    for (const f of F) for (const k of KEYS[f]) { const m = s.match(new RegExp(k.toLowerCase() + "\\D{0,12}(\\d+(?:[.,]\\d+)?)")); if (m) { state[f] = Math.min(FS[f].max, Math.max(FS[f].min, parseFloat(m[1].replace(",", ".")))); $("r_" + f).value = $("n_" + f).value = state[f]; hit++; break; } }
    $("micMsg").textContent = `${t("heard")}: "${s}"`; hit ? (run(), toast(t("filled"))) : toast(t("nothing"));
  };
  rec.onerror = () => toast(t("nothing")); rec.start();
};

  <div class="card"><h2>Yield model (${y.meta.best})</h2><p>Tested on future years (trained to 2015, tested 2016-2020).</p><table><tr><th>Model</th><th>R² (log)</th><th>Median error</th></tr>${yc}</table>

    got: "मिला", need: "अभी चाहिए", noNum: "मुझे कोई मान नहीं मिला। कृपया ऐसे लिखें: “नाइट्रोजन 90, बारिश 200”। मुझे चाहिए: N, P, K, तापमान, नमी, पीएच और बारिश।",
    all: "मेरे पास सभी 7 मान हैं।", rec: "सुझाई गई फसलें", why: "कारण", open: "फसल सलाह में खोलें", read: "🔊 सुनें", more: "आप कोई भी मान बदल सकते हैं, जैसे “बारिश 120”, मैं फिर से उत्तर दूँगा।",
    invalid: (f, v) => `${f} = ${v} मान्य नहीं है, इसलिए मैंने इसे छोड़ दिया।`, outside: (f, v, lo, hi) => `${f} = ${v} उस सीमा (${lo} से ${hi}) से बाहर है जिससे मॉडल ने सीखा है, इसलिए उत्तर पर सावधानी से भरोसा करें।`,
    ex: ["नाइट्रोजन 90, फॉस्फोरस 42, पोटैशियम 43, तापमान 21, नमी 82, पीएच 6.5, बारिश 203", "नाइट्रोजन 40, फॉस्फोरस 68, पोटैशियम 80, तापमान 19, नमी 17, पीएच 7.3, बारिश 80", "बारिश 200 मिमी"] },
  ta: { tab: "அரட்டை", title: "உங்கள் சொற்களில் கேளுங்கள்", hint: "உங்கள் வயலின் மண் மற்றும் காலநிலை மதிப்புகளை எழுதுங்கள், எ.கா: நைட்ரஜன் 90, பாஸ்பரஸ் 42, பொட்டாசியம் 43, வெப்பநிலை 21, ஈரப்பதம் 82, பிஎச் 6.5, மழை 203. இது பயிர் ஆலோசனையில் உள்ள அதே பயிற்சி பெற்ற மாதிரியைப் பயன்படுத்துகிறது; இணையம் இல்லாமலும் இயங்கும்.",
    ph: "வயல் மதிப்புகளை எழுதுங்கள்...", send: "அனுப்பு", reset: "புதிய வயல்", tryEx: "எடுத்துக்காட்டு", known: "இதுவரை மதிப்புகள்",
    got: "கிடைத்தது", need: "இன்னும் தேவை", noNum: "எந்த மதிப்பும் கிடைக்கவில்லை. “நைட்ரஜன் 90, மழை 200” போல எழுதுங்கள். தேவை: N, P, K, வெப்பநிலை, ஈரப்பதம், பிஎச், மழை.",
    all: "7 மதிப்புகளும் கிடைத்தன.", rec: "பரிந்துரைக்கப்பட்ட பயிர்கள்", why: "காரணம்", open: "பயிர் ஆலோசனையில் திற", read: "🔊 கேளுங்கள்", more: "எந்த மதிப்பையும் மாற்றலாம், எ.கா. “மழை 120”, நான் மீண்டும் பதிலளிப்பேன்.",
    invalid: (f, v) => `${f} = ${v} சரியான மதிப்பு அல்ல, அதனால் தவிர்த்தேன்.`, outside: (f, v, lo, hi) => `${f} = ${v} மாதிரி கற்ற வரம்புக்கு (${lo} முதல் ${hi}) வெளியே உள்ளது, எனவே பதிலை எச்சரிக்கையுடன் பாருங்கள்.`,
    ex: ["நைட்ரஜன் 90, பாஸ்பரஸ் 42, பொட்டாசியம் 43, வெப்பநிலை 21, ஈரப்பதம் 82, பிஎச் 6.5, மழை 203", "நைட்ரஜன் 40, பாஸ்பரஸ் 68, பொட்டாசியம் 80, வெப்பநிலை 19, ஈரப்பதம் 17, பிஎச் 7.3, மழை 80", "மழை 200 மிமீ"] },
};
let chatVals = {}, chatLang = "en", chatLastTop = null, chatLastWhy = null;
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const cnL = (lg, c) => (lg === "en" ? c : CROPN[lg][c] || c);
const fnL = (lg, f) => FEAT[lg][f];
const fmtV = (v) => +(+v).toFixed(1);
function addBubble(kind, html) {
  const d = document.createElement("div"); d.className = "bub " + kind; d.innerHTML = html;
  $("chatLog").appendChild(d); $("chatLog").scrollTop = $("chatLog").scrollHeight; return d;
}
function renderKnown() {
  $("chatKnown").innerHTML = `<span class="muted">${CHAT[L].known}:</span> ` + F.map((f) => `<span class="kn ${f in chatVals ? "has" : ""}">${fnL(L, f).split(" (")[0]}${f in chatVals ? " " + fmtV(chatVals[f]) : ""}</span>`).join("");
}
function renderChatStatic() {
  const c = CHAT[L]; $("tabChatBtn").textContent = c.tab; $("chatTitle").textContent = c.title; $("chatHint").textContent = c.hint;
  $("chatIn").placeholder = c.ph; $("chatSend").textContent = c.send; $("chatReset").textContent = c.reset; $("chatTry").textContent = c.tryEx + ":";
  $("chatEx").innerHTML = c.ex.map((x, i) => `<button class="ghost" data-ex="${i}">${esc(x.length > 38 ? x.slice(0, 36) + "…" : x)}</button>`).join("");
  renderKnown();
}
function chatAnswer(lg) {
  const c = CHAT[lg], top = E.topCrops(crop, chatVals, 3), best = top[0].crop, why = E.explainCrop(crop, meta, chatVals, best);
  chatLastTop = top; chatLastWhy = why; chatLang = lg;
  const rows = top.map((o, i) => `<div class="crop ${i ? "" : "first"}"><div class="nm">${esc(cnL(lg, o.crop))}${lg !== "en" ? `<small>${o.crop}</small>` : ""}</div><div class="bar"><i style="width:${(o.prob * 100).toFixed(1)}%"></i></div><div class="pct">${(o.prob * 100).toFixed(0)}%</div></div>`).join("");
  const reasons = why.slice(0, 3).map((w) => `<li><b>${esc(fnL(lg, w.feature))}</b> ${fmtV(w.value)} <span class="chip ${w.status}">${T[lg][w.status]}</span></li>`).join("");
  addBubble("bot", `<b>${c.all}</b><h3>${c.rec}</h3>${rows}<h3>${c.why} (${esc(cnL(lg, best))})</h3><ul class="why">${reasons}</ul>
    <div class="row" style="margin-top:10px"><button class="ghost" data-act="open">${c.open}</button><button class="ghost" data-act="read">${c.read}</button></div>
    <div class="muted" style="font-size:12.5px;margin-top:8px">${c.more}</div><div class="muted" style="font-size:12px;margin-top:4px">${T[lg].disclaimer}</div>`);
}
function handleChat(text) {
  text = text.trim(); if (!text) return;
  addBubble("me", esc(text));
  const p = parseMessage(text, FS), lg = p.lang !== "en" ? p.lang : L, c = CHAT[lg];
  p.warnings.forEach((w) => addBubble("bot warn", w.reason === "invalid" ? c.invalid(fnL(lg, w.feature).split(" (")[0], fmtV(w.value)) : c.outside(fnL(lg, w.feature).split(" (")[0], fmtV(w.value), fmtV(w.min), fmtV(w.max))));
  Object.assign(chatVals, p.values); renderKnown();
  if (!Object.keys(p.values).length && !Object.keys(chatVals).length) return addBubble("bot", c.noNum);
  if (!Object.keys(p.values).length) return p.warnings.length ? null : addBubble("bot", c.noNum);
  const missing = F.filter((f) => !(f in chatVals));
  if (missing.length) {
    const have = F.filter((f) => f in chatVals).map((f) => `${fnL(lg, f).split(" (")[0]} ${fmtV(chatVals[f])}`).join(", ");
    return addBubble("bot", `${c.got}: <b>${esc(have)}</b><br>${c.need}: <b>${missing.map((f) => esc(fnL(lg, f).split(" (")[0])).join(", ")}</b>`);
  }
  chatAnswer(lg);
}
$("chatForm").onsubmit = (e) => { e.preventDefault(); const v = $("chatIn").value; $("chatIn").value = ""; handleChat(v); };
$("chatReset").onclick = () => { chatVals = {}; $("chatLog").innerHTML = ""; renderKnown(); addBubble("bot", CHAT[L].hint); };
$("chatEx").onclick = (e) => { const i = e.target.dataset.ex; if (i !== undefined) handleChat(CHAT[L].ex[+i]); };
$("chatLog").onclick = (e) => {
  const a = e.target.dataset.act; if (!a) return;
  if (a === "open") {
    F.forEach((f) => { state[f] = chatVals[f]; });
    document.querySelectorAll("#tabs button").forEach((b) => b.classList.toggle("on", b.dataset.t === "crop"));
    ["crop", "yield", "fert", "info", "chat"].forEach((s) => $(s).classList.toggle("hidden", s !== "crop"));
    buildSliders(); run();
  } else if (a === "read") {
    if (!("speechSynthesis" in window)) return toast(t("unsupported"));
    const w = chatLastWhy[0], u = new SpeechSynthesisUtterance(T[chatLang].say(cnL(chatLang, chatLastTop[0].crop), (chatLastTop[0].prob * 100).toFixed(0), `${fnL(chatLang, w.feature).split(" (")[0]} ${fmtV(w.value)}`));
    u.lang = SPEECH[chatLang]; speechSynthesis.cancel(); speechSynthesis.speak(u);
  }
};
$("chatMic").onclick = () => {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition; if (!SR) return toast(t("unsupported"));
  const rec = new SR(); rec.lang = SPEECH[L]; rec.onresult = (e) => handleChat(e.results[0][0].transcript); rec.onerror = () => toast(t("nothing")); rec.start();
};

/* ---------- ui wiring ---------- */
function applyLang() {
  document.documentElement.lang = L;
  document.querySelectorAll("[data-i]").forEach((e) => { e.textContent = t(e.dataset.i); });
  $("lang").querySelectorAll("button").forEach((b) => b.classList.toggle("on", b.dataset.l === L));
  buildSliders(); buildPresets(); run(); runYield(); runFert(); renderChatStatic();
}
$("lang").onclick = (e) => { if (e.target.dataset.l) { L = e.target.dataset.l; applyLang(); } };
$("tabs").onclick = (e) => { const k = e.target.dataset.t; if (!k) return; document.querySelectorAll("#tabs button").forEach((b) => b.classList.toggle("on", b === e.target)); ["crop", "yield", "fert", "info", "chat"].forEach((s) => $(s).classList.toggle("hidden", s !== k)); };
buildYield(); buildInfo(); applyLang(); addBubble("bot", CHAT[L].hint);
window.__ready = true;
</script>
